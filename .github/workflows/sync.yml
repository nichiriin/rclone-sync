name: Hourly rclone copy

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview copies without modifying the destination
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rclone-remote-sync
  cancel-in-progress: false

jobs:
  copy:
    if: github.repository == 'nichiriin/rclone-sync' && (github.event_name == 'workflow_dispatch' || vars.SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
    steps:
      - name: Validate secrets
        env:
          TELDRIVE_ENV: ${{ secrets.TELDRIVE_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG" || { echo 'Missing RCLONE_CONFIG secret'; exit 1; }
          test -n "$TELDRIVE_ENV" || { echo 'Missing TELDRIVE_ENV secret'; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/rclone-sync"
          printf '%s\n' "$TELDRIVE_ENV" > "$RUNNER_TEMP/rclone-sync/teldrive.env"

      - name: Install pinned forked rclone
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/rclone-bin"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://github.com/divyam234/nix-pkgs/releases/download/rclone-v1.75.2/rclone-v1.75.2-linux-amd64.tar.gz' \
            --output "$install_dir/rclone.tar.gz"
          printf '%s  %s\n' '7aafa0a0298be89c03c1491d0e53bde4c72fa4c67df2d9b2855ecb8684bdc7e7' "$install_dir/rclone.tar.gz" | sha256sum --check --status
          tar --no-same-owner -xzf "$install_dir/rclone.tar.gz" -C "$install_dir" \
            --strip-components=1 rclone-v1.75.2-linux-amd64/rclone
          chmod 755 "$install_dir/rclone"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/rclone" version

      - name: Start Teldrive v2 on localhost
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/tgdrive/teldrive:v2
          docker run --detach --name teldrive-sync --network host \
            --env-file "$RUNNER_TEMP/rclone-sync/teldrive.env" \
            ghcr.io/tgdrive/teldrive:v2 > /dev/null
          # Any HTTP response confirms the listener is up; authentication is checked by rclone.
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null --max-time 3 http://localhost:8080/; then exit 0; fi
            if test "$(docker inspect --format '{{.State.Running}}' teldrive-sync)" != true; then
              echo 'Teldrive exited; verify TELDRIVE_ENV and database connectivity'; exit 1
            fi
            sleep 2
          done
          echo 'Teldrive did not listen on localhost:8080'; exit 1

      - name: Copy assets and library
        timeout-minutes: 115
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          common=(--check-first --teldrive-api-host http://localhost:8080
            --max-duration 110m --cutoff-mode HARD --retries 1
            --stats 1m --stats-one-line --log-level ERROR)
          if test "$DRY_RUN" = true; then common+=(--dry-run); fi
          # Run both folder copies within the same time budget and concurrency group.
          timeout --signal=TERM --kill-after=30s 112m \
            rclone copy tdrive:assets gpix:assets --transfers 25 "${common[@]}" \
            > "$RUNNER_TEMP/rclone-sync/assets.log" 2>&1 &
          assets_pid=$!
          timeout --signal=TERM --kill-after=30s 112m \
            rclone copy tdrive:library gpix:library --transfers 4 "${common[@]}" \
            > "$RUNNER_TEMP/rclone-sync/library.log" 2>&1 &
          library_pid=$!
          trap 'kill "$assets_pid" "$library_pid" 2>/dev/null || true' EXIT
          assets_status=0
          library_status=0
          wait "$assets_pid" || assets_status=$?
          wait "$library_pid" || library_status=$?
          trap - EXIT
          printf 'assets exit status: %s\nlibrary exit status: %s\n' \
            "$assets_status" "$library_status" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for status in "$assets_status" "$library_status"; do
            case "$status" in
              0) echo 'Folder copy completed.' ;;
              10) echo 'Duration reached; remaining files will be checked next run.' ;;
              *) echo "Folder copy failed (exit $status)."; failed=1 ;;
            esac
          done
          exit "$failed"

      - name: Clean up
        if: always()
        shell: bash
        run: |
          docker rm --force teldrive-sync > /dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/rclone-sync" "$RUNNER_TEMP/rclone-bin"
